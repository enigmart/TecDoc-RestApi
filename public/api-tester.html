<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecDoc API Tester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .result-container {
            max-height: 500px;
            overflow-y: auto;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1rem;
        }
        .loading {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">TecDoc API Tester</h1>
        
        <!-- Health Check -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Health Check</h5>
            </div>
            <div class="card-body">
                <button class="btn btn-primary" onclick="healthCheck()">Check API Health</button>
                <div id="health-result" class="mt-3"></div>
            </div>
        </div>

        <!-- Suppliers -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Suppliers</h5>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="supplier-brand" placeholder="Search by brand (e.g., BOSCH)">
                    </div>
                    <div class="col-md-3">
                        <input type="number" class="form-control" id="supplier-per-page" placeholder="Per page" value="10">
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-success" onclick="searchSuppliers()">Search Suppliers</button>
                    </div>
                </div>
                <div id="suppliers-result" class="result-container"></div>
            </div>
        </div>

        <!-- Articles -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Articles</h5>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="article-nr" placeholder="Article number (e.g., 0 001)">
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="article-brand" placeholder="Brand (e.g., BOSCH)">
                    </div>
                    <div class="col-md-2">
                        <input type="number" class="form-control" id="article-per-page" placeholder="Per page" value="10">
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-success" onclick="searchArticles()">Search Articles</button>
                    </div>
                </div>
                <div id="articles-result" class="result-container"></div>
            </div>
        </div>

        <!-- Article Search by Number -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Quick Article Search</h5>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="quick-article-nr" placeholder="Enter article number (min 3 chars)">
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-info" onclick="quickArticleSearch()">Quick Search</button>
                    </div>
                </div>
                <div id="quick-search-result" class="result-container"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/tecdoc-api/public/api';
        
        function showLoading(containerId) {
            document.getElementById(containerId).innerHTML = '<div class="text-center"><div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div></div>';
        }
        
        function showError(containerId, error) {
            document.getElementById(containerId).innerHTML = `<div class="alert alert-danger">Error: ${error}</div>`;
        }
        
        async function healthCheck() {
            showLoading('health-result');
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                document.getElementById('health-result').innerHTML = `
                    <div class="alert alert-success">
                        <strong>Status:</strong> ${data.status}<br>
                        <strong>Timestamp:</strong> ${data.timestamp}<br>
                        <strong>Database:</strong> ${data.database}
                    </div>
                `;
            } catch (error) {
                showError('health-result', error.message);
            }
        }
        
        async function searchSuppliers() {
            showLoading('suppliers-result');
            try {
                const brand = document.getElementById('supplier-brand').value;
                const perPage = document.getElementById('supplier-per-page').value || 10;
                
                let url = `${API_BASE}/suppliers?per_page=${perPage}`;
                if (brand) url += `&brand=${encodeURIComponent(brand)}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                let html = `<h6>Found ${data.total || data.data.length} suppliers</h6><table class="table table-sm">
                    <thead><tr><th>ID</th><th>Brand</th><th>Full Name</th><th>Logo</th></tr></thead><tbody>`;
                
                data.data.forEach(supplier => {
                    html += `<tr>
                        <td>${supplier.SUP_ID}</td>
                        <td><strong>${supplier.SUP_BRAND}</strong></td>
                        <td>${supplier.SUP_FULL_NAME}</td>
                        <td>${supplier.SUP_LOGO_NAME || 'N/A'}</td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                document.getElementById('suppliers-result').innerHTML = html;
            } catch (error) {
                showError('suppliers-result', error.message);
            }
        }
        
        async function searchArticles() {
            showLoading('articles-result');
            try {
                const articleNr = document.getElementById('article-nr').value;
                const brand = document.getElementById('article-brand').value;
                const perPage = document.getElementById('article-per-page').value || 10;
                
                let url = `${API_BASE}/articles?per_page=${perPage}`;
                if (articleNr) url += `&article_nr=${encodeURIComponent(articleNr)}`;
                if (brand) url += `&brand=${encodeURIComponent(brand)}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                let html = `<h6>Found ${data.total || data.data.length} articles (Page ${data.current_page || 1})</h6>
                    <table class="table table-sm"><thead><tr><th>ID</th><th>Article Nr</th><th>Brand</th><th>Supplier ID</th></tr></thead><tbody>`;
                
                data.data.forEach(article => {
                    html += `<tr>
                        <td>${article.ART_ID}</td>
                        <td><strong>${article.ART_ARTICLE_NR}</strong></td>
                        <td>${article.ART_SUP_BRAND}</td>
                        <td>${article.ART_SUP_ID}</td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                document.getElementById('articles-result').innerHTML = html;
            } catch (error) {
                showError('articles-result', error.message);
            }
        }
        
        async function quickArticleSearch() {
            const articleNr = document.getElementById('quick-article-nr').value;
            if (articleNr.length < 3) {
                showError('quick-search-result', 'Please enter at least 3 characters');
                return;
            }
            
            showLoading('quick-search-result');
            try {
                const response = await fetch(`${API_BASE}/articles/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ article_nr: articleNr })
                });
                
                const data = await response.json();
                
                let html = `<h6>Found ${data.length} articles</h6>
                    <table class="table table-sm"><thead><tr><th>ID</th><th>Article Nr</th><th>Brand</th><th>Supplier</th></tr></thead><tbody>`;
                
                data.forEach(article => {
                    html += `<tr>
                        <td>${article.ART_ID}</td>
                        <td><strong>${article.ART_ARTICLE_NR}</strong></td>
                        <td>${article.ART_SUP_BRAND}</td>
                        <td>${article.supplier ? article.supplier.SUP_FULL_NAME : 'N/A'}</td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                document.getElementById('quick-search-result').innerHTML = html;
            } catch (error) {
                showError('quick-search-result', error.message);
            }
        }
        
        // Auto health check on load
        window.onload = function() {
            healthCheck();
        };
    </script>
</body>
</html>
